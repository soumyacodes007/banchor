<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { --bg:#0E0B1A; --card:#1A1530; --line:#2E2650; --text:#F4F2FF; --dim:#A49CC8; --accent:#836EF9; }
    * { box-sizing:border-box; }
    body { margin:0; width:340px; background:var(--bg); color:var(--text);
           font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line); }
    header h1 { font-size:14px; margin:0; }
    .mode { margin-left:auto; display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
    .mode button { background:none; border:0; color:var(--dim); padding:4px 10px; font:inherit; cursor:pointer; }
    .mode button.on { background:var(--accent); color:#fff; }
    section { padding:12px 14px; border-bottom:1px solid var(--line); }
    .row { display:flex; justify-content:space-between; padding:4px 0; font-variant-numeric:tabular-nums; }
    .dim { color:var(--dim); }
    .big { font-size:22px; font-weight:700; }
    .btns { display:flex; gap:8px; margin-top:10px; }
    .btns button, .full { flex:1; padding:9px; border-radius:9px; border:1px solid var(--accent); background:none; color:var(--text); font:inherit; font-weight:600; cursor:pointer; }
    .primary { background:var(--accent) !important; color:#fff; }
    button:disabled { opacity:.5; cursor:default; }
    label.t { display:flex; justify-content:space-between; align-items:center; padding:4px 0; }
    details summary { cursor:pointer; color:var(--dim); }
    input[type=text], textarea { width:100%; background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:6px; font:12px ui-monospace,monospace; margin:3px 0 8px; }
    textarea { height:70px; }
    .err { color:#FF8A8A; font-size:12px; }
    a { color:var(--accent); }
    .empty { color:var(--dim); padding:6px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Doomscroll Dividends</h1>
    <div class="mode" role="group" aria-label="Mode">
      <button data-mode="roast">Roast</button><button data-mode="detox">Detox</button>
    </div>
  </header>

  <section>
    <div class="dim">This week</div>
    <div id="sites"></div>
  </section>

  <section>
    <div class="dim" id="buyLabel">Ready to buy</div>
    <div class="big" id="total">$0.00</div>
    <div id="basket"></div>
    <div class="btns">
      <button id="notNow">Not now</button>
      <button id="buy" class="primary">Buy my scroll</button>
    </div>
    <div class="err" id="err"></div>
  </section>

  <section>
    <div class="row"><span>Wallet USDC <span class="dim">(Monad testnet)</span></span><span id="usdc">—</span></div>
    <button class="full" id="topup" style="margin-top:6px">Top up $50</button>
    <div id="history"></div>
  </section>

  <section>
    <label class="t">Live mode ($1/min, for the stage) <input type="checkbox" id="live"></label>
    <label class="t">Highlight to buy <input type="checkbox" id="highlight"></label>
    <label class="t">Ask me weekly instead of every 30 min <input type="checkbox" id="weekly"></label>
    <div class="btns"><button id="reset">Reset unbought</button></div>
  </section>

  <section>
    <details id="cfg">
      <summary>Settings</summary>
      <div class="dim" style="margin-top:8px">Wallet address</div>
      <input type="text" id="wallet" placeholder="0x… (set automatically when you sign in on the dashboard)">
      <div class="dim">Dashboard URL</div>
      <input type="text" id="dashboardUrl" placeholder="https://….vercel.app">
      <div class="dim">Backend URL</div>
      <input type="text" id="backendUrl" placeholder="https://….up.railway.app">
      <div class="dim">Monad testnet RPC</div>
      <input type="text" id="rpcUrl">
      <div class="dim">addresses.json</div>
      <textarea id="addresses" placeholder='{"MockUSDC":"0x…","ScrollBasket":"0x…","METAx":"0x…"}'></textarea>
      <button class="full primary" id="save">Save</button>
      <div class="err" id="cfgErr"></div>
    </details>
  </section>

  <script src="popup.js"></script>
</body>
</html>
